<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Disconnected sample</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font: 20px system-ui;
      }
      html[data-prismal-broken="a"] body {
        background: #f4eeff;
      }
    </style>
  </head>
  <body>
    <h1>Client disconnected</h1>
    <p>This page prevents the client from announcing readiness.</p>
    <script>
      addEventListener("DOMContentLoaded", (event) => event.stopImmediatePropagation(), true);
    </script>
  </body>
</html>
