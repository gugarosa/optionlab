<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumen — a little room to think</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #273a36;
        background: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid #688b74;
        outline-offset: 4px;
      }
      ::selection {
        background: #d7e6d7;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      svg {
        vertical-align: middle;
      }
      .site-nav {
        min-height: 88px;
        padding: 24px 6%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid #e7ebe7;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 23px;
        font-weight: 650;
        letter-spacing: -1px;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 14px;
      }
      .nav-links a {
        text-decoration: none;
      }
      .nav-links a:hover {
        text-decoration: underline;
      }
      .nav-search {
        margin-right: auto;
        max-width: 280px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        background: #f3f6f3;
        border-radius: 7px;
      }
      .nav-search input {
        width: 100%;
        background: none;
        border: 0;
        min-width: 0;
        outline-offset: 6px;
      }
      .nav-menu {
        display: none;
      }
      html[data-ol-nav="a"] .site-nav {
        background: #f3f6f3;
        border: 0;
      }
      html[data-ol-nav="a"] .nav-links {
        margin-right: auto;
      }
      html[data-ol-nav="b"] .site-nav {
        min-height: 76px;
        padding-top: 16px;
        padding-bottom: 16px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 12px 20px;
        border: 1px solid #cdd8cf;
        border-radius: 7px;
        text-decoration: none;
        background: white;
        font-size: 14px;
        font-weight: 600;
        color: #273a36;
      }
      .button:hover {
        background: #edf3ed;
      }
      .button.primary-action {
        background: #294f3d;
        color: white;
        border-color: #294f3d;
      }
      .button.primary-action:hover {
        background: #1d3b2c;
      }
      .button.small {
        min-height: 36px;
        padding: 8px 14px;
        font-size: 12px;
      }
      .hero {
        padding: 76px 6% 64px;
      }
      .hero h1 {
        font-size: 62px;
        font-weight: 560;
        line-height: 1.07;
        letter-spacing: -2.4px;
        max-width: 690px;
        text-wrap: balance;
      }
      .hero .intro {
        color: #576b63;
        font-size: 18px;
        line-height: 1.6;
        max-width: 510px;
        margin: 24px 0 28px;
      }
      .hero-current {
        max-width: 760px;
        margin: 0 auto;
        text-align: center;
        padding-block: 100px;
      }
      .hero-current h1,
      .hero-current .intro {
        margin-inline: auto;
      }
      .hero-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
        align-items: center;
      }
      .hero-split h1 {
        font-size: 56px;
      }
      .subtle {
        font-size: 12px;
        color: #61756a;
        line-height: 1.6;
        margin-top: 14px;
      }
      .proof-list {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 32px;
        padding-top: 32px;
        margin-top: 32px;
        border-top: 1px solid #dce5dd;
        font-size: 17px;
        color: #3f5a48;
      }
      .proof-list span {
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .proof-list small {
        font-size: 12px;
        font-weight: 400;
        color: #61756a;
      }
      .workspace {
        display: grid;
        grid-template-columns: 132px 1fr;
        border: 1px solid #cdd8cf;
        border-radius: 12px;
        min-height: 330px;
        overflow: hidden;
        background: #f4f7f1;
      }
      .workspace aside {
        background: #e9f0e6;
        padding: 20px 14px;
        font-size: 12px;
      }
      .workspace aside strong {
        display: block;
        margin-bottom: 22px;
      }
      .workspace aside span {
        display: block;
        padding: 9px 0;
        color: #526b57;
      }
      .workspace aside span:first-of-type {
        color: #294f3d;
        font-weight: 600;
      }
      .note-paper {
        background: #fff;
        margin: 20px;
        padding: 24px;
        border: 1px solid #dde6d9;
        border-radius: 6px;
      }
      .note-paper h3 {
        font-family: Georgia, serif;
        font-size: 23px;
        line-height: 1.2;
        font-weight: 400;
      }
      .note-paper p {
        font-size: 13px;
        line-height: 1.8;
        color: #5d6a60;
        margin-top: 16px;
      }
      .note-paper ul {
        font-size: 12px;
        line-height: 2;
        color: #5d6a60;
        padding-left: 18px;
      }
      .paper-meta {
        display: block;
        font-size: 10px;
        color: #6e796a;
        margin-bottom: 18px;
      }
      .capture-form {
        display: flex;
        gap: 8px;
        max-width: 500px;
      }
      .capture-form input {
        min-width: 0;
        flex: 1;
        border: 1px solid #abbcad;
        border-radius: 7px;
        padding: 12px;
        background: #fff;
      }
      .capture-form input::placeholder {
        color: #61756a;
      }
      .email-aside {
        padding: 40px;
        background: #edf3e8;
        border-radius: 12px;
      }
      .email-aside .note-paper {
        margin: 0 0 16px;
      }
      .email-aside .note-paper:last-child {
        margin-bottom: 0;
      }
      .demo-editor {
        border: 1px solid #cdd8cf;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }
      .editor-title {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 14px 20px;
        border-bottom: 1px solid #dce5dd;
        background: #edf3e8;
        font-size: 12px;
      }
      .demo-editor textarea {
        width: 100%;
        height: 210px;
        resize: vertical;
        border: 0;
        padding: 28px;
        color: #34483c;
        line-height: 1.8;
        background: white;
      }
      .editor-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-top: 1px solid #e7ebe7;
        font-size: 12px;
        color: #61756a;
      }
      .story-heading {
        max-width: 650px;
      }
      .story-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin: 40px 0 28px;
      }
      .story-scene {
        background: #f3f6ef;
        border-radius: 10px;
        padding: 24px;
      }
      .story-scene:nth-child(2) {
        background: #eef3f8;
      }
      .story-scene:nth-child(3) {
        background: #f7f0e9;
      }
      .story-scene h3 {
        font-size: 18px;
        margin: 18px 0 12px;
      }
      .story-scene p {
        font-size: 14px;
        line-height: 1.6;
        color: #59695c;
      }
      .collection {
        padding: 48px 6% 72px;
        border-top: 1px solid #e7ebe7;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 20px;
        margin-bottom: 24px;
      }
      .section-head h2 {
        font-size: 26px;
        font-weight: 550;
        letter-spacing: -0.6px;
      }
      .section-head span {
        font-size: 13px;
        color: #61756a;
      }
      .collection-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .collection-grid .note-paper {
        margin: 0;
        min-height: 185px;
      }
      .collection-grid .note-paper:nth-child(2) {
        background: #f4f7f1;
      }
      .collection-grid .note-paper:nth-child(3) {
        background: #f6f3eb;
      }
      .pricing-head {
        padding: 64px 6% 24px;
        text-align: center;
      }
      .pricing-head h1 {
        font-size: 46px;
        font-weight: 550;
        letter-spacing: -1.5px;
      }
      .pricing-head p {
        color: #61756a;
        margin-top: 16px;
        font-size: 17px;
      }
      .billing-toggle {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin: 28px auto;
        padding: 4px;
        border: 1px solid #dce5dd;
        background: #f4f7f1;
        border-radius: 8px;
        width: fit-content;
      }
      .billing-toggle button {
        border: 0;
        border-radius: 5px;
        background: none;
        color: #526657;
        padding: 9px 16px;
        font-size: 13px;
      }
      .billing-toggle button[aria-pressed="true"] {
        background: #294f3d;
        color: white;
      }
      .plans {
        padding: 16px 6% 64px;
      }
      .plan-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .plan {
        padding: 28px;
        border: 1px solid #d7e1d7;
        border-radius: 10px;
        background: white;
      }
      .plan h2 {
        font-size: 22px;
        font-weight: 550;
      }
      .plan p {
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.6;
        color: #61756a;
      }
      .price {
        display: block;
        font-size: 40px;
        letter-spacing: -1px;
        font-weight: 550;
        margin: 24px 0 2px;
      }
      .price small {
        font-size: 13px;
        letter-spacing: 0;
        color: #61756a;
        font-weight: 400;
      }
      .plan ul {
        padding-left: 18px;
        font-size: 14px;
        line-height: 2.2;
        margin: 24px 0;
        color: #4e6253;
      }
      .plan .button {
        width: 100%;
      }
      .plan.featured {
        background: #edf3e8;
        border-color: #849d83;
      }
      .plan-a {
        padding: 0;
        overflow: hidden;
      }
      .plan-a header {
        padding: 28px;
        background: #edf3e8;
        border-bottom: 1px solid #d7e1d7;
      }
      .plan-a .plan-details {
        padding: 0 28px 28px;
      }
      .plan-a:nth-child(2) header {
        background: #e9f0f5;
      }
      .plan-a:nth-child(3) header {
        background: #f6eee4;
      }
      .compare-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      .compare-table caption {
        text-align: left;
        font-size: 22px;
        margin-bottom: 24px;
      }
      .compare-table th,
      .compare-table td {
        border-bottom: 1px solid #d7e1d7;
        text-align: left;
        padding: 20px;
      }
      .compare-table thead {
        background: #edf3e8;
      }
      .compare-table .price {
        font-size: 28px;
        margin: 0;
      }
      .compare-table th.plan {
        border-radius: 0;
        border-width: 0 0 1px;
      }
      .guided-plan {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: center;
        padding: 40px;
        background: #edf3e8;
        border-radius: 12px;
      }
      .guided-plan h2 {
        font-size: 30px;
        letter-spacing: -0.8px;
      }
      .guided-plan p {
        line-height: 1.6;
        color: #576b63;
        margin: 16px 0 24px;
      }
      .plan-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .plan-picker button {
        border: 1px solid #a7b9a6;
        border-radius: 7px;
        background: white;
        padding: 12px 16px;
        color: #294f3d;
      }
      .plan-picker button[aria-pressed="true"] {
        background: #294f3d;
        color: white;
      }
      .pricing-note {
        text-align: center;
        font-size: 13px;
        color: #61756a;
        margin-top: 28px;
      }
      footer {
        padding: 24px 6%;
        border-top: 1px solid #e7ebe7;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 12px;
        color: #61756a;
      }
      .feedback {
        min-height: 20px;
        font-size: 13px;
        color: #294f3d;
        margin-top: 12px;
      }
      @media (max-width: 600px) {
        .site-nav {
          padding: 20px;
          min-height: 72px;
          gap: 16px;
        }
        .wordmark {
          font-size: 21px;
        }
        .nav-links {
          gap: 16px;
          font-size: 13px;
        }
        .nav-links .button {
          display: none;
        }
        .nav-search {
          max-width: 145px;
          margin-right: 0;
        }
        .nav-search input {
          font-size: 12px;
        }
        html[data-ol-nav="a"] .site-nav {
          flex-wrap: wrap;
        }
        html[data-ol-nav="a"] .nav-links {
          order: 3;
          width: 100%;
          margin-right: 0;
          padding-top: 8px;
        }
        html[data-ol-nav="b"] .nav-links {
          display: none;
        }
        .hero {
          padding: 48px 24px;
        }
        .hero h1,
        .hero-split h1 {
          font-size: 39px;
          letter-spacing: -1.4px;
          line-height: 1.12;
        }
        .hero-current {
          padding-block: 72px;
        }
        .hero .intro {
          font-size: 16px;
          margin-top: 20px;
        }
        .hero-split,
        .story-grid,
        .collection-grid,
        .plan-grid,
        .guided-plan {
          grid-template-columns: 1fr;
          gap: 24px;
        }
        .workspace {
          grid-template-columns: 92px 1fr;
          min-height: 280px;
        }
        .workspace aside {
          padding: 18px 10px;
          font-size: 10px;
        }
        .note-paper {
          padding: 18px;
          margin: 14px;
        }
        .note-paper h3 {
          font-size: 20px;
        }
        .proof-list {
          gap: 16px 24px;
          font-size: 14px;
        }
        .proof-list small {
          width: 100%;
        }
        .capture-form {
          flex-direction: column;
        }
        .email-aside {
          padding: 20px;
        }
        .story-grid {
          margin-top: 28px;
        }
        .collection {
          padding: 32px 24px 48px;
        }
        .section-head {
          display: block;
        }
        .section-head h2 {
          font-size: 23px;
          margin-bottom: 8px;
        }
        .pricing-head {
          padding: 44px 24px 16px;
        }
        .pricing-head h1 {
          font-size: 36px;
          letter-spacing: -1px;
        }
        .pricing-head p {
          font-size: 16px;
          line-height: 1.5;
        }
        .plans {
          padding: 16px 24px 48px;
        }
        .plan {
          padding: 24px;
        }
        .plan-a {
          padding: 0;
        }
        .guided-plan {
          padding: 24px;
        }
        .guided-plan h2 {
          font-size: 26px;
        }
        .compare-table th,
        .compare-table td {
          padding: 14px 5px;
          font-size: 11px;
        }
        .compare-table .price {
          font-size: 22px;
        }
        .compare-table .button {
          padding: 8px 6px;
          min-height: 34px;
          font-size: 10px;
        }
        footer {
          flex-direction: column;
          padding: 24px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const leaf =
        '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 4c-9-1-16 2-16 8a7 7 0 0 0 7 7c6 0 10-7 9-15Z"/><path d="M4 20 15 9"/></svg>';
      const option = (id) => window.optionlab?.choice(id) || "now";
      const demo = { billing: "monthly", plan: 1 };
      const plans = [
        {
          name: "Free",
          price: 0,
          intro: "For a thought you don't want to lose.",
          features: ["50 notes", "3 collections", "All your devices"],
        },
        {
          name: "Plus",
          price: 8,
          intro: "For the ideas you keep coming back to.",
          features: ["Unlimited notes", "Unlimited collections", "Share a collection"],
        },
        {
          name: "Team",
          price: 16,
          intro: "For the good work you do together.",
          features: ["Everything in Plus", "A shared workspace", "Team permissions"],
        },
      ];
      function navigation() {
        const search =
          option("nav") === "b"
            ? '<label class="nav-search"><input aria-label="Search sample notes" placeholder="Find a note..." /></label>'
            : "";
        return `<nav class="site-nav" aria-label="Main"><a class="wordmark" href="#/">${leaf}lumen</a>${search}<div class="nav-links"><a href="#/">Notes</a><a href="#/pricing">Plans</a><a href="#/pricing" class="button small">Start writing</a></div></nav>`;
      }
      const intro =
        '<p class="intro">Catch the passing thought. Connect the dots later. Lumen is a quiet place for everything taking shape.</p>';
      const cta =
        '<a href="#/pricing" class="button primary-action">Find your space <span aria-hidden="true">→</span></a>';
      const workspace = `<div class="workspace" aria-label="Sample notebook"><aside><strong>Your workspace</strong><span>All notes</span><span>Small ideas</span><span>Field notes</span><span>For later</span></aside><article class="note-paper" data-ol-name="Sample note"><span class="paper-meta">FIELD NOTES / OCTOBER 02</span><h3>Things I noticed on the way</h3><p>The light in the kitchen at four. A sentence from a book. A question worth keeping.</p><ul><li>Take the longer way home</li><li>Leave a little room</li></ul></article></div>`;
      function hero() {
        const id = option("hero");
        if (id === "a")
          return `<section class="hero"><h1>A home for your next good idea.</h1>${intro}${cta}<div class="proof-list"><small>Sample collections</small><span>Small beginnings</span><span>Field notes</span><span>For a rainy day</span></div></section>`;
        if (id === "b")
          return `<section class="hero hero-split"><div><h1>A little room to think.</h1>${intro}${cta}<p class="subtle">Start with a thought. Make it your own.</p></div>${workspace}</section>`;
        if (id === "c")
          return `<section class="hero hero-split"><div><h1>Your next idea starts here.</h1>${intro}<form class="capture-form"><input type="email" required aria-label="Email address" placeholder="you@example.com" /><button class="button primary-action">Make a little space</button></form><p class="subtle">A local demo. No email is sent or stored.</p><p class="feedback" role="status"></p></div><div class="email-aside"><article class="note-paper"><h3>A thought before it goes</h3><p>What if the best part is the part we haven't planned?</p></article><article class="note-paper"><h3>Something to return to</h3><p>A small collection of things that make sense together.</p></article></div></section>`;
        if (id === "d")
          return `<section class="hero hero-split"><div><h1>Think out loud.<br>Start right here.</h1><p class="intro">No blank-page ceremony. Try a note, change a line, see where it takes you.</p>${cta}</div><div class="demo-editor"><div class="editor-title">${leaf}A note to begin with</div><textarea aria-label="Try writing a note">A small idea for today:\n\nMake something worth coming back to.</textarea><div class="editor-footer"><span id="editor-count">Your words, your space.</span><button class="button small" data-save-note>Save this note</button></div><p class="feedback" role="status"></p></div></section>`;
        if (id === "e")
          return `<section class="hero"><div class="story-heading"><h1>Every idea has a beginning.</h1><p class="intro">A passing thought becomes a connection. A connection becomes something you can share.</p></div><div class="story-grid"><article class="story-scene">${leaf}<h3>Catch a thought</h3><p>The sentence you heard. The thing you noticed. Put it somewhere it can stay.</p></article><article class="story-scene">${leaf}<h3>Find the thread</h3><p>Bring related notes into a collection. Leave room for the unexpected connection.</p></article><article class="story-scene">${leaf}<h3>Make it something</h3><p>A plan, a story, a little next step. Share it when you're ready.</p></article></div>${cta}</section>`;
        return `<section class="hero hero-current"><h1>A home for your next good idea.</h1>${intro}${cta}</section>`;
      }
      function price(plan) {
        return plan.price ? `$${demo.billing === "annual" ? plan.price - 2 : plan.price}` : "$0";
      }
      function planCard(plan, index, variant = "") {
        const heading = `<h2>${plan.name}</h2><p>${plan.intro}</p><span class="price">${price(plan)} <small>/ person / month</small></span>`;
        const details = `<ul>${plan.features.map((f) => `<li>${f}</li>`).join("")}</ul><button class="button ${index === 1 ? "primary-action" : ""} start-trial" data-trial="${plan.name}">Try ${plan.name}</button>`;
        return `<article class="plan ${index === 1 && !variant ? "featured" : ""} ${variant}">${variant ? `<header>${heading}</header><div class="plan-details">${details}</div>` : heading + details}</article>`;
      }
      function pricing() {
        const id = option("plans");
        let content = `<div class="plan-grid">${plans.map((p, i) => planCard(p, i, id === "a" ? "plan-a" : "")).join("")}</div>`;
        if (id === "b")
          content = `<table class="compare-table"><caption>A little clarity, side by side.</caption><thead><tr><th scope="col">Your space</th>${plans.map((p) => `<th class="plan" scope="col">${p.name}</th>`).join("")}</tr></thead><tbody><tr><th scope="row">Monthly price</th>${plans.map((p) => `<td><span class="price">${price(p)}</span></td>`).join("")}</tr><tr><th scope="row">Notes</th><td>50</td><td>Unlimited</td><td>Unlimited</td></tr><tr><th scope="row">Collections</th><td>3</td><td>Unlimited</td><td>Unlimited</td></tr><tr><th scope="row">Best for</th><td>A beginning</td><td>Your projects</td><td>Working together</td></tr><tr><th scope="row">Start here</th>${plans.map((p) => `<td><button class="button start-trial" data-trial="${p.name}">Try ${p.name}</button></td>`).join("")}</tr></tbody></table>`;
        if (id === "c")
          content = `<div class="guided-plan"><div><h2>What are you making room for?</h2><p>Start with how you work. You can always change your mind.</p><div class="plan-picker" aria-label="Choose your use"><button data-plan="0" aria-pressed="${demo.plan === 0}">A few thoughts</button><button data-plan="1" aria-pressed="${demo.plan === 1}">My projects</button><button data-plan="2" aria-pressed="${demo.plan === 2}">Our team</button></div></div>${planCard(plans[demo.plan], demo.plan)}</div>`;
        return `<header class="pricing-head"><h1>A little space. A plan that fits.</h1><p>Start small, or make room for everything.</p><div class="billing-toggle" aria-label="Billing period"><button data-billing="monthly" aria-pressed="${demo.billing === "monthly"}">Monthly</button><button data-billing="annual" aria-pressed="${demo.billing === "annual"}">Annual</button></div></header><section class="plans">${content}<p class="pricing-note">Sample plans for a fictional product. No purchase or account is created.</p><p class="feedback" role="status"></p></section>`;
      }
      function render() {
        const collection = `<section class="collection"><div class="section-head"><h2>Leave a little room for the unexpected.</h2><span>A few notes from a sample workspace</span></div><div class="collection-grid"><article class="note-paper"><span class="paper-meta">SMALL IDEAS</span><h3>Something for a slower Sunday</h3><p>A walk without a destination. Coffee with a friend. One thing made by hand.</p></article><article class="note-paper"><span class="paper-meta">FIELD NOTES</span><h3>Green, in all its forms</h3><p>The small garden behind the library. New leaves on an old street.</p></article><article class="note-paper"><span class="paper-meta">FOR LATER</span><h3>A question worth keeping</h3><p>What would this look like if it were a little simpler?</p></article></div></section>`;
        document.getElementById("app").innerHTML =
          navigation() +
          (location.hash.startsWith("#/pricing") ? pricing() : hero() + collection) +
          "<footer><span>Lumen. A little room to think.</span><span>Fictional product demo for optionlab.</span></footer>";
        document.title = location.hash.startsWith("#/pricing")
          ? "Plans / Lumen"
          : "Lumen / A little room to think";
      }
      document.addEventListener("click", (event) => {
        const target = event.target instanceof Element ? event.target.closest("button") : null;
        if (!target) return;
        if (target.dataset.billing) {
          demo.billing = target.dataset.billing;
          render();
        }
        if (target.dataset.plan) {
          demo.plan = Number(target.dataset.plan);
          render();
        }
        if (target.hasAttribute("data-save-note"))
          document.querySelector(".feedback").textContent = "Your sample note is saved for this visit.";
        if (target.dataset.trial)
          document.querySelector(".feedback").textContent =
            `${target.dataset.trial} selected. This is a local demo, so no account is created.`;
      });
      document.addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector(".feedback").textContent =
          "Your space is ready to imagine. No email was sent.";
      });
      document.addEventListener("input", (event) => {
        if (event.target instanceof HTMLTextAreaElement)
          document.getElementById("editor-count").textContent =
            `${event.target.value.length} characters, one beginning.`;
      });
      addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
